name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make gradlew executable
        run: chmod +x android_app/gradlew

      - name: Build Android APK
        working-directory: ./android_app
        run: ./gradlew assembleDebug --stacktrace

      - name: Prepare APK for Download
        run: |
          mkdir -p output_apk
          cp android_app/app/build/outputs/apk/debug/app-debug.apk output_apk/APCNF_Cadre_Attendance_App_v2.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: APCNF_Cadre_Attendance_App_v2
          path: output_apk/APCNF_Cadre_Attendance_App_v2.apk
          retention-days: 30
